<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra - Techly Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo-container">
    <img src="imagens/logo.png" alt="Techly Store Logo">
    <h1>Techly Store</h1>
  </div>

  <nav>
    <a href="index.html">Início</a>
    <a href="produtos.html">Produtos</a>
    <a href="ofertas.html">Ofertas</a>
    <a href="contato.html">Contato</a>
  </nav>
</header>

<!-- CHECKOUT -->
<section class="checkout">
  <h2>Finalizar Compra</h2>
  <div id="checkout-items"></div>
  <div id="checkout-total"></div>
  <form id="checkout-form">
    <h3>Informações de Entrega</h3>
    <input type="text" name="name" placeholder="Nome Completo" required>
    <input type="email" name="email" placeholder="E-mail" required>
    <input type="text" name="address" placeholder="Endereço" required>
    <input type="text" name="city" placeholder="Cidade" required>
    <input type="text" name="zip" placeholder="CEP" required>

    <h3>Pagamento</h3>
    <select name="payment" required>
      <option value="">Selecione</option>
      <option value="pix">PIX</option>
    </select>

    <button type="submit" class="btn">Gerar QR Code PIX</button>
  </form>

  <div id="pix-section" class="pix-section hidden">
    <h3>Pagamento PIX</h3>
    <p id="success-message">Compra finalizada! Use o QR Code abaixo para pagar via PIX.</p>
    <div class="qr-separator"></div>
    <div id="pix-code" class="pix-code"></div>
    <p class="pix-info">Chave PIX: <strong>+55 11 97462-1278</strong></p>
    <p class="pix-info">Total: <strong id="pix-total"></strong></p>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
